<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Monitor — 台美股終極SOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ─── Variables ────────────────────────────────────────────────────────── */
:root {
  --bg0: #080c14;
  --bg1: #0d1117;
  --bg2: #161b22;
  --bg3: #1c2230;
  --border: #21283a;
  --border2: #2d3748;
  --txt1: #e2e8f4;
  --txt2: #8896a9;
  --txt3: #55657a;
  --green: #22c55e;
  --green-dim: rgba(34,197,94,.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,.12);
  --yellow: #eab308;
  --yellow-dim: rgba(234,179,8,.12);
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,.12);
  --cyan: #06b6d4;
  --cyan-dim: rgba(6,182,212,.12);
  --accent: #7c3aed;
  --accent2: #a855f7;
}

/* ─── Reset ───────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg0);
  color: var(--txt1);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  overflow-x: hidden;
}
button { cursor: pointer; font-family: inherit; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg1); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ─── Topbar ──────────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 56px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.topbar-brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--cyan) 100%);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: #fff; letter-spacing: -0.5px;
}
.brand-title { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
.brand-sub   { font-size: 11px; color: var(--txt3); font-weight: 400; margin-top: 1px; }

.topbar-meta { display: flex; align-items: center; gap: 20px; }
.meta-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 20px; font-size: 11px; color: var(--txt2);
}
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 6px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.topbar-actions { display: flex; align-items: center; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 7px;
  font-size: 12px; font-weight: 500;
  transition: all .15s; border: 1px solid transparent;
}
.btn-ghost   { background: var(--bg2); border-color: var(--border); color: var(--txt1); }
.btn-ghost:hover { background: var(--bg3); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent2); }
.btn-icon    { width: 14px; height: 14px; opacity: .7; }

/* ─── Page layout ─────────────────────────────────────────────────────── */
.page { padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }

/* ─── Stock grid ──────────────────────────────────────────────────────── */
.stock-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.scard {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  position: relative; overflow: hidden;
  transition: border-color .2s;
}
.scard:hover { border-color: var(--border2); }
.scard::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 12px;
  pointer-events: none;
  border-top: 2px solid transparent;
}
.scard.up::after   { border-top-color: var(--red); }
.scard.down::after { border-top-color: var(--green); }
.scard.flat::after { border-top-color: var(--border2); }

.scard-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 12px;
}
.scard-sym  { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }
.scard-name { font-size: 10px; color: var(--txt3); margin-top: 2px; font-weight: 400; }
.scard-tag  {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  padding: 2px 7px; border-radius: 10px;
}
.tag-above { background: var(--red-dim);   color: var(--red);   }
.tag-below { background: var(--green-dim); color: var(--green); }

.scard-price {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px; font-weight: 700; letter-spacing: -1px;
  line-height: 1; margin-bottom: 6px;
}
.scard-chg {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; font-weight: 600;
}
.pos { color: var(--red); }
.neg { color: var(--green); }
.neu { color: var(--txt2); }

.scard-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

.scard-metrics { display: flex; flex-direction: column; gap: 5px; }
.metric-row {
  display: flex; justify-content: space-between; align-items: center;
}
.metric-lbl { font-size: 10px; color: var(--txt3); }
.metric-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
}

/* indicator badge inside card */
.ind-badge {
  display: inline-block;
  font-size: 9px; font-weight: 700; letter-spacing: .3px;
  padding: 1px 5px; border-radius: 4px;
}
.ind-overbought  { background: var(--red-dim);               color: var(--red);    }
.ind-oversold    { background: var(--green-dim);             color: var(--green);  }
.ind-golden      { background: var(--green-dim);             color: var(--green);  }
.ind-dead        { background: var(--red-dim);               color: var(--red);    }
.ind-bull        { background: var(--cyan-dim);              color: var(--cyan);   }
.ind-bear        { background: rgba(255,255,255,.05);        color: var(--txt3);   }
.ind-bearish-div { background: rgba(251,146,60,.15); color: #fb923c;
                   border: 1px solid rgba(251,146,60,.35); }
.ind-bullish-div { background: rgba(168,85,247,.15);  color: var(--accent2);
                   border: 1px solid rgba(168,85,247,.35); }

/* divergence banner inside card top */
.div-banner {
  font-size: 9px; font-weight: 700; letter-spacing: .4px;
  padding: 3px 10px; margin: -16px -18px 10px;
  display: flex; align-items: center; gap: 6px;
}
.div-banner-bearish { background: rgba(251,146,60,.12); border-bottom: 1px solid rgba(251,146,60,.25); color: #fb923c; }
.div-banner-bullish { background: rgba(168,85,247,.12); border-bottom: 1px solid rgba(168,85,247,.25); color: var(--accent2); }

/* ─── Main content ────────────────────────────────────────────────────── */
.content-row {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 18px;
  align-items: start;
}

/* ─── Panel base ──────────────────────────────────────────────────────── */
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.panel-title { font-size: 13px; font-weight: 600; }
.panel-body  { padding: 16px 18px; }

/* ─── Chart panel ─────────────────────────────────────────────────────── */
.chart-tabs { display: flex; gap: 4px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
.chart-tabs::-webkit-scrollbar { height: 3px; }
.chart-tabs::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
.ctab {
  background: none; border: 1px solid var(--border);
  color: var(--txt2); padding: 4px 12px; border-radius: 6px;
  font-size: 11px; font-weight: 600; transition: all .15s;
  flex-shrink: 0;
}
.ctab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.ctab:hover:not(.active) { background: var(--bg3); }

.chart-wrap   { padding: 16px 18px 0; height: 300px; position: relative; }
.chart-legend { display: flex; gap: 16px; padding: 10px 18px 14px; }
.leg-item     { display: flex; align-items: center; gap: 6px; }
.leg-line     { width: 20px; height: 2px; border-radius: 1px; }
.leg-label    { font-size: 10px; color: var(--txt2); }

/* ─── SOP panel ───────────────────────────────────────────────────────── */
.sop-stack { display: flex; flex-direction: column; gap: 10px; }
.sop-item  { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.sop-item-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.sop-num-title { display: flex; align-items: center; gap: 8px; }
.sop-num  { font-size: 9px; font-weight: 800; color: var(--txt3); letter-spacing: .5px; }
.sop-name { font-size: 13px; font-weight: 700; }
.badge {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .4px; padding: 2px 7px; border-radius: 10px;
}
.badge-normal  { background: var(--green-dim);        color: var(--green);  }
.badge-watch   { background: var(--yellow-dim);       color: var(--yellow); }
.badge-alert   { background: var(--red-dim);          color: var(--red);    }
.badge-active  { background: var(--blue-dim);         color: var(--blue);   }
.badge-standby { background: rgba(255,255,255,.05);   color: var(--txt3);   }

.sop-item-bd { padding: 10px 14px; }
.sop-rule { font-size: 10px; color: var(--txt3); margin-bottom: 5px; line-height: 1.4; }
.sop-val  { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }

/* ─── Bottom row ──────────────────────────────────────────────────────── */
.bottom-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 18px;
}

/* ─── Alert list ──────────────────────────────────────────────────────── */
.alert-scroll { max-height: 260px; overflow-y: auto; }
.alert-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
}
.alert-row:last-child { border-bottom: none; }
.adot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.adot-crit { background: var(--red);   box-shadow: 0 0 6px var(--red);   }
.adot-buy  { background: var(--green); box-shadow: 0 0 6px var(--green); }
.adot-info { background: var(--blue);  }
.alert-ttl { font-size: 12px; font-weight: 600; }
.alert-msg { font-size: 10px; color: var(--txt2); margin-top: 2px; line-height: 1.4; }
.alert-ts  { font-size: 9px;  color: var(--txt3); margin-top: 3px; font-variant-numeric: tabular-nums; }
.empty-box { padding: 28px; text-align: center; color: var(--txt3); font-size: 11px; }

/* ─── Smile detail ────────────────────────────────────────────────────── */
.smile-header { font-size: 11px; color: var(--txt2); margin-bottom: 12px; }
.smile-grid   { display: flex; flex-direction: column; gap: 6px; }
.smile-row    { display: flex; align-items: center; gap: 10px; }
.smile-thr {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 600;
  width: 34px; text-align: right; color: var(--txt2);
}
.smile-track { flex: 1; height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.smile-fill  { height: 100%; border-radius: 3px; background: var(--border2); transition: background .3s, width .4s; }
.smile-fill.hit { background: var(--red); }
.smile-price-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--txt3); width: 52px;
}
.smile-state { font-size: 9px; width: 36px; text-align: right; font-weight: 700; }
.smile-foot {
  margin-top: 12px; padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 10px; color: var(--txt3); line-height: 1.6;
}

/* ─── Chip panel ─────────────────────────────────────────────────────── */
.chip-table { width:100%; border-collapse:collapse; font-size:11px; }
.chip-table th {
  text-align:right; padding:5px 10px; color:var(--txt3);
  font-size:9px; font-weight:600; letter-spacing:.3px; border-bottom:1px solid var(--border);
}
.chip-table th:first-child { text-align:left; }
.chip-table td {
  text-align:right; padding:6px 10px; border-bottom:1px solid var(--border);
  font-family:'JetBrains Mono',monospace; font-size:11px;
}
.chip-table td:first-child { text-align:left; font-family:'Inter',sans-serif; font-weight:600; }
.chip-table tr:last-child td { border-bottom:none; }
.chip-table tr:hover td { background:var(--bg3); }
.chip-note { font-size:9px; color:var(--txt3); margin-top:10px; line-height:1.5; }

/* ─── Market Sentiment ────────────────────────────────────────────────── */
.vix-bar-wrap {
  height: 6px; background: var(--bg3); border-radius: 3px;
  margin-top: 8px; overflow: hidden;
}
.vix-bar { height: 100%; border-radius: 3px; transition: width .5s, background .3s; }
.vix-scale {
  display: flex; justify-content: space-between;
  font-size: 9px; color: var(--txt3); margin-top: 3px;
}
.fn-total-row {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 6px; margin-top: 4px;
  border-top: 1px solid var(--border);
}

/* ─── Search ─────────────────────────────────────────────────────────── */
.search-wrap {
  display:flex; align-items:center; gap:6px;
}
.search-input {
  background:var(--bg2); border:1px solid var(--border); border-radius:7px;
  color:var(--txt1); font-family:inherit; font-size:12px;
  padding:5px 12px; width:150px; outline:none; transition:border-color .15s;
}
.search-input:focus { border-color:var(--cyan); }
.search-input::placeholder { color:var(--txt3); }
.search-overlay {
  display:none; position:fixed; inset:0; z-index:200;
  background:rgba(8,12,20,.85); backdrop-filter:blur(4px);
  align-items:flex-start; justify-content:center; padding-top:80px;
}
.search-overlay.open { display:flex; }
.search-modal {
  background:var(--bg2); border:1px solid var(--border2); border-radius:14px;
  width:min(600px,94vw); max-height:82vh; overflow-y:auto;
  padding:22px 24px; position:relative;
}
.search-modal-close {
  position:absolute; top:14px; right:16px;
  background:none; border:none; color:var(--txt3); font-size:18px; cursor:pointer;
  line-height:1; transition:color .15s;
}
.search-modal-close:hover { color:var(--txt1); }
.search-modal-sym  { font-size:22px; font-weight:800; letter-spacing:-.5px; }
.search-modal-name { font-size:11px; color:var(--txt3); margin-top:2px; }
.search-modal-price{ font-size:34px; font-weight:800; margin:10px 0 2px; font-family:'JetBrains Mono',monospace; }
.search-chart-wrap { height:180px; margin:14px 0 6px; }
.search-loading { text-align:center; padding:40px; color:var(--txt3); font-size:13px; }
.search-error   { text-align:center; padding:30px; color:var(--red); font-size:12px; }

/* ─── Spinner ─────────────────────────────────────────────────────────── */
.sk   { display: flex; justify-content: center; padding: 28px; }
.spin {
  width: 20px; height: 20px;
  border: 2px solid var(--border); border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Toast ───────────────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 20px; right: 20px; z-index: 999;
  padding: 11px 16px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 9px; font-size: 12px; font-weight: 500;
  transform: translateY(20px); opacity: 0;
  transition: all .2s; pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }

/* ─── Responsive ──────────────────────────────────────────────────────── */
@media (max-width: 1200px) {
  .stock-grid  { grid-template-columns: repeat(2, 1fr); }
  .content-row { grid-template-columns: 1fr; }
  .bottom-row  { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 768px) {
  .stock-grid { grid-template-columns: 1fr; }
  .bottom-row { grid-template-columns: 1fr; }
}

/* ─── Cash Bot ────────────────────────────────────────────────────────── */
.cb-slider {
  -webkit-appearance:none;appearance:none;
  width:130px;height:4px;border-radius:2px;background:var(--bg3);outline:none;cursor:pointer;
}
.cb-slider::-webkit-slider-thumb {
  -webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;background:var(--cyan);cursor:pointer;
  box-shadow:0 0 6px rgba(6,182,212,.5);
}
.cb-top-grid {
  display:grid;grid-template-columns:1fr 1.2fr 1.8fr;gap:14px;margin-bottom:14px;
}
.cb-card {
  background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
}
.cb-card-title {
  font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--txt3);margin-bottom:10px;
}
.cb-tier-name { font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.2; }
.cb-alloc-bar-wrap {
  height:10px;background:var(--bg0);border-radius:5px;overflow:hidden;
  margin:8px 0;border:1px solid var(--border);display:flex;
}
.cb-alloc-stock { height:100%;transition:width .5s,background .3s;border-radius:5px 0 0 5px; }
.cb-alloc-cash  { height:100%;background:rgba(255,255,255,.04);flex:1; }
.cb-action-box  { border-radius:8px;padding:12px 16px;border-left:3px solid; }
.cb-action-hold   { background:rgba(34,197,94,.07);  border-color:var(--green); }
.cb-action-reduce { background:rgba(239,68,68,.07);  border-color:var(--red);   }
.cb-action-add    { background:rgba(59,130,246,.07); border-color:var(--blue);  }
.cb-tiers-wrap { display:flex;flex-direction:column;gap:4px;margin-top:14px; }
.cb-tiers-title {
  font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--txt3);margin-bottom:6px;
}
.cb-tier-row {
  display:flex;align-items:center;gap:10px;
  padding:6px 10px;border-radius:7px;border:1px solid transparent;
}
.cb-tier-row.current { background:rgba(6,182,212,.09);border-color:rgba(6,182,212,.28); }
.cb-tier-label { font-size:11px;font-weight:600;width:68px;flex-shrink:0; }
.cb-tier-thr   { font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--txt3);width:54px;flex-shrink:0; }
.cb-tier-bar   { flex:1;height:5px;background:var(--bg0);border-radius:3px;overflow:hidden; }
.cb-tier-bar-fill { height:100%;border-radius:3px; }
.cb-tier-pcts  { font-family:'JetBrains Mono',monospace;font-size:10px;width:64px;text-align:right;flex-shrink:0; }
.cb-signal {
  font-size:10px;color:var(--txt2);padding:6px 10px;background:var(--bg3);
  border-radius:6px;border-left:2px solid var(--yellow);line-height:1.4;
}
@media (max-width:900px) { .cb-top-grid { grid-template-columns:1fr 1fr; } }
@media (max-width:600px) { .cb-top-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

<!-- ─── Topbar ─────────────────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="topbar-brand">
    <div class="brand-mark">SM</div>
    <div>
      <div class="brand-title">STOCK MONITOR</div>
      <div class="brand-sub">台美股終極 SOP 監控系統</div>
    </div>
  </div>

  <div class="topbar-meta">
    <div class="meta-pill">
      <div class="pulse-dot"></div>
      <span id="clockDisplay">--:--:--</span>
      &ensp;台北時間
    </div>
    <div class="meta-pill">
      更新：<span id="updatedAt">載入中…</span>
      &ensp;|&ensp;快取：<span id="cacheAge">-</span>s 前
    </div>
  </div>

  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="text"
           placeholder="搜尋股票代號…"
           onkeydown="if(event.key==='Enter') doSearch()"
           autocomplete="off" spellcheck="false">
    <button class="btn btn-ghost" onclick="doSearch()" style="padding:5px 10px">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l3.5 3.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="topbar-actions">
    <button class="btn btn-ghost" id="refreshBtn" onclick="forceRefresh()">
      <svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M13.7 2.3A7 7 0 1 0 14 8" stroke-linecap="round"/>

    <button class="btn btn-primary" onclick="testNotify()">

        <path d="M8 1a5 5 0 0 0-5 5v3l-1.5 2h13L13 9V6a5 5 0 0 0-5-5zm0 14a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2z"/>
      </svg>

</header>

<!-- ─── Page ──────────────────────────────────────────────────────────────── -->

          <button class="ctab"        onclick="switchChart(this,'00865B')">00865B</button>

  <!-- 台股籌碼 panel -->

<div class="search-overlay" id="searchOverlay" onclick="closeSearch(event)">

    <div id="searchContent"></div>
  </div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ─── State ───────────────────────────────────────────────────────────────── */
let chart     = null;
let curSym    = '0050';
let state     = null;
let cbBasePct = parseInt(localStorage.getItem('cbBasePct') || '80');

/* ─── Clock ───────────────────────────────────────────────────────────────── */
function tickClock() {
  document.getElementById('clockDisplay').textContent =
    new Date().toLocaleTimeString('zh-TW', {hour12:false, timeZone:'Asia/Taipei'});
}
setInterval(tickClock, 1000); tickClock();

/* ─── Utils ───────────────────────────────────────────────────────────────── */
const f   = (n, d=2) => n == null ? '-' : Number(n).toFixed(d);
const fc  = n => n == null ? '-' : (n>=0?'+':'')+Number(n).toFixed(2)+'%';
const cls = n => n == null ? 'neu' : n>0?'pos':n<0?'neg':'neu';

function fyi(v) {
  if (v == null) return '-';
  const abs  = Math.abs(v);
  const sign = v >= 0 ? '+' : '-';
  if (abs >= 1e8)  return sign + (abs/1e8).toFixed(1)  + '億';
  if (abs >= 1e4)  return sign + (abs/1e4).toFixed(0)  + '萬';
  return sign + abs.toFixed(0);
}

function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

/* ─── Fetch ───────────────────────────────────────────────────────────────── */
async function loadData() {
  try {
    const r = await fetch('/api/dashboard');
    if (!r.ok) throw new Error(r.statusText);
    state = await r.json();
    render();
    if (state.stocks && Object.keys(state.stocks).length < ORDER.length) {
      setTimeout(loadData, 10000);
    }
  } catch(e) {
    console.error(e);
    toast('資料載入失敗', false);
  }
}

async function forceRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '載入中…';
  try {
    await fetch('/api/refresh', {method:'POST'});
    await loadData();
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M13.7 2.3A7 7 0 1 0 14 8" stroke-linecap="round"/>
      <path d="M14 2v4h-4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg> 重新整理`;
  }
}

async function testNotify() {
  try {
    const r = await fetch('/api/notify', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:'[測試] 台美股SOP監控系統正常運作，LINE通知設定成功！'})
    });
    const d = await r.json();
    toast(d.ok ? 'LINE 通知已發送' : '發送失敗', d.ok);
  } catch(e) { toast('發送失敗', false); }
}

/* ─── Render ──────────────────────────────────────────────────────────────── */
function render() {
  if (!state) return;
  document.getElementById('updatedAt').textContent = state.updated_at || '-';
  document.getElementById('cacheAge').textContent  = state.price_age  ?? '-';

  renderStockGrid(state.stocks);
  renderSOP(state.sop);
  renderAlerts(state.alerts, state.alert_history);
  renderSmile(state.sop);
  renderChart(curSym);
  renderMarketSentiment(state.vix, state.foreign_net);
  renderCashBot(cbBasePct);
  renderChips(state.tw_chips);
}

/* ── Stock grid ── */
const NAMES = {
  '0050':'元大台灣50', 'QQQ':'Invesco QQQ',
  '00631L':'台灣50正2', 'QLD':'Ultra QQQ (2x)',
  '00662':'富邦NASDAQ', '00865B':'國泰US短債',
  'GOOG':'Alphabet (Google)', 'NVDA':'NVIDIA', 'TSLA':'Tesla',
};
const ORDER = ['0050','QQQ','00631L','QLD','00662','00865B','GOOG','NVDA','TSLA'];

function rsiColor(v) {
  if (v == null) return 'var(--txt2)';
  if (v > 70)   return 'var(--red)';
  if (v < 30)   return 'var(--green)';
  return 'var(--txt2)';
}
function rsiLabel(v) {
  if (v == null) return '';
  if (v > 80)   return '<span class="ind-badge ind-overbought">強烈超買</span>';
  if (v > 70)   return '<span class="ind-badge ind-overbought">超買</span>';
  if (v < 20)   return '<span class="ind-badge ind-oversold">強烈超賣</span>';
  if (v < 30)   return '<span class="ind-badge ind-oversold">超賣</span>';
  return '';
}
function macdBadge(cross, trend) {
  if (cross === 'golden') return '<span class="ind-badge ind-golden">金叉 ↑</span>';
  if (cross === 'dead')   return '<span class="ind-badge ind-dead">死叉 ↓</span>';
  if (trend === 'bull')   return '<span class="ind-badge ind-bull">多頭</span>';
  if (trend === 'bear')   return '<span class="ind-badge ind-bear">空頭</span>';
  return '-';
}
function kdColor(k) {
  if (k == null) return 'var(--txt2)';
  if (k > 80)   return 'var(--red)';
  if (k < 20)   return 'var(--green)';
  return 'var(--txt2)';
}
function divBadge(div) {
  if (!div)          return '<span style="color:var(--txt3)">-</span>';
  if (div.bearish)   return '<span class="ind-badge ind-bearish-div">↑↓ 頂部背離</span>';
  if (div.bullish)   return '<span class="ind-badge ind-bullish-div">↓↑ 底部背離</span>';
  return '<span style="color:var(--txt3);font-size:10px">正常</span>';
}
function divBanner(div) {
  if (!div || (!div.bearish && !div.bullish)) return '';
  if (div.bearish) return `<div class="div-banner div-banner-bearish">▲ 頂部背離警示 — 動能衰退，留意假突破，暫緩追高正2</div>`;
  if (div.bullish) return `<div class="div-banner div-banner-bullish">▼ 底部背離確認 — 下跌動能枯竭，佈局信心增強</div>`;
  return '';
}

function renderStockGrid(stocks) {
  if (!stocks) return;
  document.getElementById('stockGrid').innerHTML = ORDER.map(sym => {
    const s = stocks[sym];
    if (!s) return `<div class="scard flat"><div class="sk"><div class="spin"></div></div></div>`;
    const dc     = s.daily_change;
    const cardCls = dc > 0 ? 'up' : dc < 0 ? 'down' : 'flat';
    const tagCls  = s.above_ma200 ? 'tag-above' : 'tag-below';
    const tagTxt  = s.above_ma200 ? '年線上' : '年線下';

    return `
    <div class="scard ${cardCls}">
      ${divBanner(s.divergence)}
      <div class="scard-top">
        <div>
          <div class="scard-sym">${sym}</div>
          <div class="scard-name">${NAMES[sym]||''}</div>
        </div>
        <span class="scard-tag ${tagCls}">${tagTxt}</span>
      </div>
      <div class="scard-price">${f(s.price)}</div>
      <div class="scard-chg ${cls(dc)}">${fc(dc)} 今日</div>
      <hr class="scard-divider">
      <div class="scard-metrics">
        <div class="metric-row">
          <span class="metric-lbl">200MA 年線</span>
          <span class="metric-val">${f(s.ma200)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-lbl">偏離年線</span>
          <span class="metric-val ${cls(s.pct_from_ma200)}">${fc(s.pct_from_ma200)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-lbl">50MA</span>
          <span class="metric-val">${f(s.ma50)}</span>
        </div>
      </div>
      <hr class="scard-divider">
      <div class="scard-metrics">
        <div class="metric-row">
          <span class="metric-lbl">RSI 14&ensp;${rsiLabel(s.rsi)}</span>
          <span class="metric-val" style="color:${rsiColor(s.rsi)}">${s.rsi != null ? f(s.rsi,1) : '-'}</span>
        </div>
        <div class="metric-row">
          <span class="metric-lbl">K / D (9)</span>
          <span class="metric-val" style="color:${kdColor(s.k_val)}">${(s.k_val!=null&&s.d_val!=null)?f(s.k_val,1)+' / '+f(s.d_val,1):'-'}</span>
        </div>
        <div class="metric-row">
          <span class="metric-lbl">MACD</span>
          <span class="metric-val">${macdBadge(s.macd_cross, s.macd_trend)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-lbl">背離偵測</span>
          <span class="metric-val">${divBadge(s.divergence)}</span>
        </div>
        ${s.premium_pct != null ? `
        <div class="metric-row">
          <span class="metric-lbl">折溢價 (IOPV)</span>
          <span class="metric-val ${cls(s.premium_pct)}">${fc(s.premium_pct)}</span>
        </div>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ── SOP panel ── */
const STATUS_LABEL = {normal:'正常', watch:'留意', alert:'警報', active:'啟動', standby:'待命'};
const STATUS_CLS   = {normal:'badge-normal', watch:'badge-watch', alert:'badge-alert', active:'badge-active', standby:'badge-standby'};

function sopValueClass(key, sop) {
  if (key==='sop02') return cls(sop.qqq_pct);
  if (key==='sop03') return cls(sop.daily_change);
  if (key==='sop04' || key==='sop05') return cls(sop.pct_from_ma);
  return 'neu';
}

function renderSOP(sop) {
  if (!sop) return;
  const keys = ['sop01','sop02','sop03','sop04','sop05'];
  document.getElementById('sopStack').innerHTML = keys.map((k,i) => {
    const s = sop[k]; if (!s) return '';
    const vc = sopValueClass(k, s);
    return `
    <div class="sop-item">
      <div class="sop-item-hd">
        <div class="sop-num-title">
          <span class="sop-num">0${i+1}</span>
          <span class="sop-name">${s.name}</span>
        </div>
        <span class="badge ${STATUS_CLS[s.status]}">${STATUS_LABEL[s.status]||s.status}</span>
      </div>
      <div class="sop-item-bd">
        <div class="sop-rule">${s.desc_rule}</div>
        <div class="sop-val ${vc}">${s.desc_val}</div>
      </div>
    </div>`;
  }).join('');
}

/* ── Alert list ── */
function renderAlerts(cur, hist) {
  const all = [...(cur||[]), ...(hist||[])];
  const badge = document.getElementById('alertBadge');

  if (!all.length) {
    document.getElementById('alertList').innerHTML = '<div class="empty-box">目前無觸發紀錄</div>';
    badge.textContent = '無警報'; badge.style.color = 'var(--txt3)';
    return;
  }

  const critCount = all.filter(a=>a.type==='CRITICAL').length;
  badge.textContent = critCount ? `${critCount} 項警報` : `${all.length} 筆紀錄`;
  badge.style.color = critCount ? 'var(--red)' : 'var(--yellow)';

  document.getElementById('alertList').innerHTML = all.slice(0,15).map(a => {
    const dotCls = a.type==='CRITICAL' ? 'adot-crit' : a.type==='BUY' ? 'adot-buy' : 'adot-info';
    const ts = a.ts ? new Date(a.ts).toLocaleString('zh-TW') : '-';
    return `
    <div class="alert-row">
      <div class="adot ${dotCls}"></div>
      <div>
        <div class="alert-ttl">[${a.code}] ${a.title}</div>
        <div class="alert-msg">${a.msg}</div>
        <div class="alert-ts">${ts}</div>
      </div>
    </div>`;
  }).join('');
}

/* ── Smile detail ── */
function renderSmile(sop) {
  const s04 = sop?.sop04;
  if (!s04?.smile_levels) return;

  const p = s04.pct_from_ma;
  document.getElementById('smileDetail').innerHTML = `
    <div class="smile-header">
      目前 0050 偏離年線：<strong class="${cls(p)}">${fc(p)}</strong>
    </div>
    <div class="smile-grid">
      ${s04.smile_levels.map(l => `
        <div class="smile-row">
          <span class="smile-thr ${l.triggered?'pos':'neu'}">${l.threshold}%</span>
          <div class="smile-track">
            <div class="smile-fill ${l.triggered?'hit':''}" style="width:${l.triggered?'100':'0'}%"></div>
          </div>
          <span class="smile-price-lbl">${l.price>0?f(l.price,2):'-'}</span>
          <span class="smile-state" style="color:${l.triggered?'var(--red)':'var(--txt3)'}">${l.triggered?'觸及':'未達'}</span>
        </div>`).join('')}
    </div>
    <div class="smile-foot">
      左側各 5% 買入 &nbsp;|&nbsp; 右側（反彈後）各 2% 買入<br>
      跌破 -30% 進入冬眠，停止加碼
    </div>`;
}

/* ── Market Sentiment ── */
function renderMarketSentiment(vix, fn) {
  const panel = document.getElementById('sentimentPanel');
  const badge = document.getElementById('vixBadge');
  if (!panel) return;

  let html = '';

  /* VIX section */
  if (vix) {
    const vp = vix.price;
    const vixBarColor = vp > 30 ? 'var(--red)' : vp > 20 ? 'var(--yellow)' : 'var(--green)';
    const vixTextColor = vp > 30 ? 'var(--red)' : vp > 20 ? 'var(--yellow)' : 'var(--txt2)';
    const vixLevel = vp > 40 ? '極度恐慌' : vp > 30 ? '高度恐慌' : vp > 20 ? '市場偏緊' : vp < 13 ? '過度樂觀' : '正常';
    const barW = Math.min(vp / 50 * 100, 100).toFixed(1);

    badge.textContent = `VIX ${vp}`;
    badge.style.color = vixTextColor;

    html += `
    <div style="margin-bottom:16px">
      <div style="font-size:10px;color:var(--txt3);margin-bottom:8px;font-weight:600;letter-spacing:.3px">VIX 恐慌指數</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:${vixTextColor}">${vp}</span>
        <span style="font-size:10px;color:${vixTextColor};font-weight:600">${vixLevel}</span>
      </div>
      <div class="metric-row" style="margin-bottom:6px">
        <span class="metric-lbl">今日變動</span>
        <span class="metric-val ${cls(vix.daily_change)}">${fc(vix.daily_change)}</span>
      </div>
      <div class="vix-bar-wrap">
        <div class="vix-bar" style="width:${barW}%;background:${vixBarColor}"></div>
      </div>
      <div class="vix-scale">
        <span>低恐慌&lt;15</span><span>警戒&gt;20</span><span>極恐&gt;30</span><span>50</span>
      </div>
    </div>
    <hr class="scard-divider">`;
  } else {
    badge.textContent = 'VIX -';
  }

  /* 外資買賣超 section */
  if (fn) {
    const foreign = fn.foreign ?? null;
    const trust   = fn.trust   ?? null;
    const dealer  = fn.dealer  ?? null;
    const total   = (foreign != null && trust != null && dealer != null)
                    ? foreign + trust + dealer : null;
    const dateStr = fn.date ? `<span style="font-size:9px;color:var(--txt3);margin-left:6px">${fn.date}</span>` : '';

    html += `
    <div>
      <div style="font-size:10px;color:var(--txt3);margin-bottom:10px;font-weight:600;letter-spacing:.3px">
        三大法人買賣超${dateStr}
      </div>
      <div class="scard-metrics">
        <div class="metric-row">
          <span class="metric-lbl">外資及陸資</span>
          <span class="metric-val" style="color:${foreign==null?'var(--txt3)':foreign>=0?'var(--red)':'var(--green)'}">${fyi(foreign)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-lbl">投信</span>
          <span class="metric-val" style="color:${trust==null?'var(--txt3)':trust>=0?'var(--red)':'var(--green)'}">${fyi(trust)}</span>
        </div>
        <div class="metric-row">
          <span class="metric-lbl">自營商</span>
          <span class="metric-val" style="color:${dealer==null?'var(--txt3)':dealer>=0?'var(--red)':'var(--green)'}">${fyi(dealer)}</span>
        </div>
        ${total != null ? `
        <div class="fn-total-row">
          <span class="metric-lbl" style="font-weight:600;color:var(--txt2)">三大合計</span>
          <span class="metric-val" style="font-size:13px;color:${total>=0?'var(--red)':'var(--green)'}">${fyi(total)}</span>
        </div>` : ''}
      </div>
    </div>`;
  } else if (!vix) {
    html = '<div class="empty-box">資料載入中…</div>';
  } else {
    html += '<div style="font-size:10px;color:var(--txt3);margin-top:8px">外資資料尚未載入或市場休市</div>';
  }

  panel.innerHTML = html;
}

/* ── Search ── */
let searchChart = null;

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  document.getElementById('searchContent').innerHTML =
    '<div class="search-loading">搜尋中…</div>';
  document.getElementById('searchOverlay').classList.add('open');
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const d = await r.json();
    if (!r.ok || d.error) {
      document.getElementById('searchContent').innerHTML =
        `<div class="search-error">${d.error || '查詢失敗'}</div>`;
      return;
    }
    renderSearchResult(d);
  } catch(e) {
    document.getElementById('searchContent').innerHTML =
      '<div class="search-error">網路錯誤，請稍後再試</div>';
  }
}

function closeSearchModal() {
  document.getElementById('searchOverlay').classList.remove('open');
  if (searchChart) { searchChart.destroy(); searchChart = null; }
  document.getElementById('searchInput').value = '';
}

function closeSearch(e) {
  if (e.target === document.getElementById('searchOverlay')) closeSearchModal();
}

function renderSearchResult(s) {
  const dc      = s.daily_change;
  const chgCls  = dc > 0 ? 'pos' : dc < 0 ? 'neg' : 'neu';
  const tagCls  = s.above_ma200 ? 'tag-above' : 'tag-below';

  const metrics = [
    ['200MA 年線',  f(s.ma200)],
    ['偏離年線',    `<span class="${cls(s.pct_from_ma200)}">${fc(s.pct_from_ma200)}</span>`],
    ['50MA',        f(s.ma50)],
    ['RSI 14',      `<span style="color:${rsiColor(s.rsi)}">${rsiLabel(s.rsi)}${s.rsi!=null?f(s.rsi,1):'-'}</span>`],

  document.getElementById('searchContent').innerHTML = `

      <div>

    searchChart = new Chart(ctx, {

          {label:'收盤價',data:s.chart.prices,borderColor:'#06b6d4',backgroundColor:grad,
           borderWidth:1.5,pointRadius:0,fill:true,tension:.05},
          {label:'200MA',data:s.chart.ma200,borderColor:'#eab308',borderWidth:1.2,
           pointRadius:0,fill:false,borderDash:[4,2]},
          {label:'50MA', data:s.chart.ma50, borderColor:'#ef4444',borderWidth:1,
           pointRadius:0,fill:false,opacity:.6},

      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},
        scales:{x:{ticks:{maxTicksLimit:6,font:{size:9}},grid:{color:'rgba(255,255,255,.04)'}},
                y:{ticks:{font:{size:9}},grid:{color:'rgba(255,255,255,.04)'},position:'right'}}}

/* ─── Cash Bot ────────────────────────────────────────────────────────────── */
const CB_TIERS = [
  { threshold:   3, name: '多頭強勢', factor: 1.00,  state: 'bull'    },
  { threshold:   0, name: '年線整理', factor: 0.90,  state: 'neutral' },
  { threshold:  -3, name: '略低年線', factor: 0.80,  state: 'neutral' },
  { threshold:  -8, name: '中度修正', factor: 0.60,  state: 'caution' },
  { threshold: -15, name: '大幅下跌', factor: 0.40,  state: 'bear'    },
  { threshold: -20, name: '深度下跌', factor: 0.25,  state: 'bear'    },
  { threshold: -25, name: '極度下跌', factor: 0.125, state: 'danger'  },
  { threshold: -999,name: '冬眠模式', factor: 0.05,  state: 'danger'  },
];
const CB_CLR = { bull:'var(--green)', neutral:'var(--yellow)', caution:'#fb923c', bear:'var(--red)', danger:'#dc2626' };

function computeCashBot(basePct) {
  if (!state?.stocks?.['0050']) return null;
  const tw    = state.stocks['0050'];
  const pct   = tw.pct_from_ma200 || 0;
  const dc    = tw.daily_change    || 0;
  const rsi   = tw.rsi;
  const above = tw.above_ma200;
  const div   = tw.divergence || {};
  const vix   = state.vix;

  let tier = CB_TIERS[CB_TIERS.length - 1];
  for (const t of CB_TIERS) { if (pct >= t.threshold) { tier = t; break; } }

  let recStock = Math.min(basePct, Math.round(basePct * tier.factor));
  let vixAdj = false;
  if (vix?.price > 30) {
    recStock = Math.max(5, recStock - Math.min(10, Math.max(0, recStock - 5)));
    vixAdj = true;
  }
  const recCash = 100 - recStock;
  const diff    = recStock - basePct;

  let action, instruction;
  if (diff >= -2) {
    action = 'hold';
    instruction = `市場強勢，維持持股 ${basePct}%、現金 ${100-basePct}%，不需調整`;
  } else {
    const reducePct = basePct - recStock;
    const tierIdx   = CB_TIERS.findIndex(t => t === tier);
    const nextTier  = tierIdx > 0 ? CB_TIERS[tierIdx - 1] : null;
    const nextStock = nextTier ? Math.min(basePct, Math.round(basePct * nextTier.factor)) : recStock;

    if (dc > 0 && !above && nextStock > recStock) {
      const addAmt = nextStock - recStock;
      action = 'add';
      instruction = `市場今日反彈（${dc > 0 ? '+' : ''}${dc.toFixed(1)}%），可考慮逢低加碼 ${addAmt}%，將持股提升至 ${nextStock}%（需搭配確認訊號）`;
    } else {
      action = 'reduce';
      instruction = `建議減碼至持股 ${recStock}%（較目標基準減少 ${reducePct}%），現金提高至 ${recCash}%`;
    }
  }

  const signals = [];
  if (rsi != null && rsi < 30 && !above) signals.push(`RSI ${rsi.toFixed(0)} 超賣區 → 下跌動能趨緩，留意底部訊號`);
  if (div.bullish && !above)              signals.push('底部背離確認 → 下跌動能枯竭，可少量分批試單');
  if (div.bearish)                        signals.push('頂部背離警示 → 不宜追高，逢漲應逐步減碼');
  if (vixAdj)                            signals.push(`VIX ${vix.price.toFixed(0)} > 30，市場恐慌，建議額外減少持股 10%`);

  const tiersDisplay = CB_TIERS.map(t => ({
    ...t,
    stockPct: Math.min(basePct, Math.round(basePct * t.factor)),
    isCurrent: t === tier,
    thrLabel: t.threshold >= 0 ? `≥ +${t.threshold}%`
            : t.threshold === -999 ? '< -25%'
            : `≥ ${t.threshold}%`,
  }));

  return { basePct, recStock, recCash, action, instruction, signals,
           pct, dc, tierName: tier.name, tierState: tier.state, tiersDisplay,
           price: tw.price, ma200: tw.ma200, above };
}

/* ── Chip panel ── */
function fShares(v) {
  if (v == null || v === '') return '-';
  const n   = Number(v);
  const abs = Math.abs(n);
  const sign = n >= 0 ? '+' : '-';
  if (abs >= 1000000) return sign + (abs/1000000).toFixed(2) + 'M';
  if (abs >= 1000)    return sign + (abs/1000).toFixed(0)    + 'K';
  return sign + abs;
}
function chipColor(v) {
  if (v == null) return 'var(--txt3)';
  return v > 0 ? 'var(--red)' : v < 0 ? 'var(--green)' : 'var(--txt2)';
}

function renderChips(chips) {
  const panel = document.getElementById('chipPanel');
  if (!panel) return;
  if (!chips) { panel.innerHTML = '<div class="empty-box">籌碼資料載入中…</div>'; return; }

  const TW_ORDER = ['0050','00631L','00662','00865B'];
  const dateEl = document.getElementById('chipDate');
  const anyDate = TW_ORDER.map(c => chips[c]?.date).find(Boolean);
  if (dateEl && anyDate) dateEl.textContent = anyDate;

  const rows = TW_ORDER.map(code => {
    const c = chips[code];
    if (!c) return `<tr><td>${code}</td><td colspan="7" style="color:var(--txt3);text-align:center">-</td></tr>`;
    const fNet  = c.foreign_net  ?? null;
    const tNet  = c.trust_net    ?? null;
    const dNet  = c.dealer_net   ?? null;
    const tot   = c.total_net    ?? null;
    const mBal  = c.margin_bal   ?? null;
    const mChg  = c.margin_chg   ?? null;
    const sBal  = c.short_bal    ?? null;
    return `<tr>
      <td>${code}</td>
      <td style="color:${chipColor(fNet)}">${fShares(fNet)}</td>
      <td style="color:${chipColor(tNet)}">${fShares(tNet)}</td>
      <td style="color:${chipColor(dNet)}">${fShares(dNet)}</td>
      <td style="color:${chipColor(tot)};font-weight:600">${fShares(tot)}</td>
      <td style="color:var(--txt1)">${mBal != null ? mBal.toLocaleString() : '-'}</td>
      <td style="color:${chipColor(mChg)}">${mChg != null ? (mChg>=0?'+':'')+mChg.toLocaleString() : '-'}</td>
      <td style="color:var(--txt2)">${sBal != null ? sBal.toLocaleString() : '-'}</td>
    </tr>`;
  }).join('');

  panel.innerHTML = `
    <table class="chip-table">
      <thead><tr>
        <th style="text-align:left">代號</th>
        <th>外資</th><th>投信</th><th>自營</th><th>三大合計</th>
        <th>融資餘額</th><th>融資增減</th><th>融券餘額</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="chip-note">
      三大法人單位：股數 &nbsp;|&nbsp; 融資融券單位：張（1張＝1000股）
      &nbsp;|&nbsp; 紅色＝買超/增加，綠色＝賣超/減少
    </div>`;
}

function renderCashBot(basePct) {
  const r = computeCashBot(basePct);
  const mainEl  = document.getElementById('cbMain');
  const tiersEl = document.getElementById('cbTiers');
  if (!r) {
    mainEl.innerHTML = '<div class="empty-box">等待市場資料載入…</div>';
    return;
  }

  const tc         = CB_CLR[r.tierState] || 'var(--txt2)';
  const stockBarW  = ((r.recStock / 100) * 100).toFixed(1);
  const actionCls  = r.action === 'hold' ? 'cb-action-hold' : r.action === 'add' ? 'cb-action-add' : 'cb-action-reduce';
  const actionIcon = r.action === 'hold' ? '━ 維持持倉' : r.action === 'add' ? '▲ 逢低加碼機會' : '▼ 建議減碼';
  const actionClr  = r.action === 'hold' ? 'var(--green)' : r.action === 'add' ? 'var(--blue)' : 'var(--red)';

  mainEl.innerHTML = `
    <div class="cb-top-grid">
      <div class="cb-card">
        <div class="cb-card-title">目前市場狀態</div>
        <div class="cb-tier-name" style="color:${tc}">${r.tierName}</div>
        <div style="margin-top:6px;font-size:12px;color:var(--txt2)">
          年線偏離 <span class="${cls(r.pct)}" style="font-family:'JetBrains Mono',monospace;font-weight:700">${fc(r.pct)}</span>
        </div>
        ${r.price != null ? `
        <div style="display:flex;gap:14px;margin-top:8px;font-size:10px;color:var(--txt3)">
          <span>0050&nbsp;<span style="color:var(--txt1);font-family:'JetBrains Mono',monospace">${f(r.price)}</span></span>
          <span>年線&nbsp;<span style="color:var(--yellow);font-family:'JetBrains Mono',monospace">${f(r.ma200)}</span></span>
        </div>` : ''}
      </div>

      <div class="cb-card">
        <div class="cb-card-title">建議配置</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div>
            <span style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:${tc}">${r.recStock}%</span>
            <span style="font-size:9px;color:var(--txt3);margin-left:3px">持股</span>
          </div>
          <div>
            <span style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:var(--txt3)">${r.recCash}%</span>
            <span style="font-size:9px;color:var(--txt3);margin-left:3px">現金</span>
          </div>
        </div>
        <div class="cb-alloc-bar-wrap">
          <div class="cb-alloc-stock" style="width:${stockBarW}%;background:${tc}"></div>
          <div class="cb-alloc-cash"></div>
        </div>
        <div style="font-size:9px;color:var(--txt3)">目標基準：持股 ${r.basePct}% ／ 現金 ${100-r.basePct}%</div>
      </div>

      <div class="cb-card">
        <div class="cb-card-title">操作指令</div>
        <div class="cb-action-box ${actionCls}">
          <div style="font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:${actionClr};margin-bottom:5px">${actionIcon}</div>
          <div style="font-size:13px;font-weight:600;line-height:1.6;color:var(--txt1)">${r.instruction}</div>
        </div>
        ${r.signals.length ? `
        <div style="display:flex;flex-direction:column;gap:5px;margin-top:10px">
          ${r.signals.map(s => `<div class="cb-signal">${s}</div>`).join('')}
        </div>` : ''}
      </div>
    </div>`;

  tiersEl.innerHTML = r.tiersDisplay.map(t => {
    const c   = CB_CLR[t.state] || 'var(--txt2)';
    const thr = t.thrLabel;
    const bw  = ((t.stockPct / 100) * 100).toFixed(1);
    return `
    <div class="cb-tier-row ${t.isCurrent ? 'current' : ''}">
      <span class="cb-tier-label" style="color:${t.isCurrent ? 'var(--cyan)' : 'var(--txt2)'}">${t.name}</span>
      <span class="cb-tier-thr">${thr}</span>
      <div class="cb-tier-bar"><div class="cb-tier-bar-fill" style="width:${bw}%;background:${c}"></div></div>
      <span class="cb-tier-pcts" style="color:${t.isCurrent ? 'var(--cyan)' : 'var(--txt3)'}">
        ${t.stockPct}% / ${100 - t.stockPct}%
      </span>
      ${t.isCurrent ? '<span style="font-size:9px;font-weight:700;color:var(--cyan);flex-shrink:0">&#9664; 當前</span>' : ''}
    </div>`;
  }).join('');
}

function onCbSlider(val) {
  cbBasePct = parseInt(val);
  localStorage.setItem('cbBasePct', String(cbBasePct));
  document.getElementById('cbBaseLabel').textContent = val + '%';
  renderCashBot(cbBasePct);
}

document.getElementById('cbSlider').value    = cbBasePct;
document.getElementById('cbBaseLabel').textContent = cbBasePct + '%';
loadData();
setInterval(loadData, 5 * 60 * 1000);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSearchModal(); });
